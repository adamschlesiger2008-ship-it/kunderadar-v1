<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ny adgangskode | KundeRadar</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f7fc;color:#17233b}.reset-wrap{max-width:520px;margin:8vh auto;padding:28px}.reset-card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:30px;box-shadow:0 12px 32px #14243a0a}.reset-card h1{font-size:25px}.reset-card form{display:grid;gap:15px}.reset-card label{display:grid;gap:8px;font-size:13px}.reset-card input{padding:12px;border:1px solid #dce5f1;border-radius:9px;width:100%;font-size:15px}.reset-card button{padding:13px;border-radius:9px;border:0;background:#2563eb;color:white;font-weight:700}.reset-card button:disabled{opacity:.5}.reset-card p{line-height:1.6;font-size:13px}#status[role=alert]{color:#b42318}</style></head>
<body><main class="reset-wrap"><div class="reset-card"><p><a href="/">← KundeRadar</a></p><h1>Vælg en ny adgangskode</h1><p id="status" role="status">Kontrollerer dit nulstillingslink…</p><form id="resetForm" hidden><label>Ny adgangskode (mindst 12 tegn)<input id="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><label>Gentag adgangskode<input id="repeatPassword" type="password" minlength="12" autocomplete="new-password" required></label><button id="save" type="submit">Gem ny adgangskode</button></form><p id="back" hidden><a href="/#konto">Gå til login</a></p></div></main>
<script type="module">
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './auth-config.js';
const status=document.getElementById('status'), form=document.getElementById('resetForm'), back=document.getElementById('back');
const setStatus=(value,error=false)=>{status.textContent=value;status.setAttribute('role',error?'alert':'status')};
try {
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
  const url=new URL(location.href), hash=new URLSearchParams(location.hash.slice(1));
  const error=hash.get('error_description')||url.searchParams.get('error_description');
  if(error) throw new Error('Linket er udløbet eller ugyldigt. Bed om et nyt nulstillingslink.');
  let authorized=false;
  supabase.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'&&session){authorized=true;form.hidden=false;setStatus('Indtast din nye adgangskode.');}
  });
  const {data,error:sessionError}=await supabase.auth.getSession();
  if(sessionError)throw sessionError;
  if(data.session && (url.searchParams.has('recovery')||hash.get('type')==='recovery'||authorized)){
    authorized=true;form.hidden=false;setStatus('Indtast din nye adgangskode.');
  } else if(!authorized) {
    setStatus('Kunne ikke bekræfte nulstillingslinket. Bed om et nyt link fra login-siden.',true);back.hidden=false;
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(!authorized)return;
    const password=document.getElementById('newPassword').value;
    if(password!==document.getElementById('repeatPassword').value){setStatus('Adgangskoderne er ikke ens.',true);return;}
    document.getElementById('save').disabled=true;
    const {error:updateError}=await supabase.auth.updateUser({password});
    document.getElementById('save').disabled=false;
    if(updateError){setStatus('Kunne ikke gemme adgangskoden: '+updateError.message,true);return;}
    form.hidden=true;back.hidden=false;setStatus('Din adgangskode er gemt. Du kan nu logge ind.');
    history.replaceState({},'',location.pathname);
  });
}catch(e){setStatus(e.message||'Kunne ikke starte nulstillingen.',true);back.hidden=false;}
</script></body></html>
