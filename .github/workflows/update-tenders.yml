
name: KundeRadar - Sikker TED-test

# Kun manuel start.
# Ingen automatisk daglig opdatering under testen.
on:
  workflow_dispatch:

# Testen må ikke skrive ændringer til GitHub.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Kontroller eksisterende data
        run: |
          python3 -m json.tool data/opportunities.json > /dev/null
          echo "Eksisterende datafil er gyldig JSON"

      - name: Test forbindelse til TED
        run: python3 scripts/test-ted.py

      - name: Hent TED-data
        run: python3 scripts/import-ted.py

      - name: Omdan TED-data
        run: python3 scripts/convert-ted.py

      - name: Kontroller resultatet
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/opportunities.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, list) or not data:
              raise SystemExit("FEJL: Ingen udbud i resultatet")

          required = [
              "id", "title", "description",
              "category", "region", "city",
              "issuer", "publishedAt", "deadline",
              "sourceName", "sourceUrl"
          ]

          for index, item in enumerate(data, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"FEJL: Udbud {index} er ugyldigt"
                  )

              if item.get("isDemo") is not False:
                  raise SystemExit(
                      f"FEJL: Udbud {index} er ikke et offentligt udbud"
                  )

              for field in required:
                  value = item.get(field)

                  if not isinstance(value, str) or not value.strip():
                      raise SystemExit(
                          f"FEJL: Udbud {index} mangler {field}"
                      )

          with_city = sum(
              item["city"] != "Opgavested ikke oplyst"
              for item in data
          )

          print(f"Udbud i alt: {len(data)}")
          print(f"Udbud med by: {with_city}")
          print(f"Udbud uden by: {len(data) - with_city}")
          print("Datakontrol bestået")
          PY

      - name: Gem testresultater
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunderadar-ted-test
          path: |
            data/ted-raw.json
            data/opportunities.json
          if-no-files-found: warn

      - name: Bekraeft sikker test
        run: |
          echo "Testen er gennemført."
          echo "Ingen udbud er gemt tilbage til GitHub."
          echo "Den offentlige hjemmeside er ikke ændret."
