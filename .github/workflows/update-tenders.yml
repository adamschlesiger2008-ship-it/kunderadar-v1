
name: KundeRadar - Opdater udbud

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Kontroller datafil
        run: |
          python3 -m json.tool data/opportunities.json > /dev/null
          echo "KundeRadar datafil er gyldig JSON"
      - name: Test forbindelse til TED
        run: python3 scripts/test-ted.py
      - name: Test import fra TED
        run: python3 scripts/import-ted.py
     
      - name: Omdan TED-data til KundeRadar
        run: python3 scripts/convert-ted.py

      - name: Gem TED-data som artifact
        uses: actions/upload-artifact@v4
        with:
          name: ted-raw-data
          path: data/ted-raw.json
      - name: Gem opdaterede udbud i GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Opdater danske udbud fra TED"
            git push
          else
            echo "Ingen ændringer i udbud"
          fi
